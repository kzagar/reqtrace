[package]
name = "reqtrace"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
notify = "6.1"
walkdir = "2.4"
regex = "1.10"
anyhow = "1.0"
